<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Souphra">
  <defs>
    <!-- Fondo: rojo profundo, de brasa arriba a vino abajo -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b3121f"/>
      <stop offset="45%" stop-color="#780000"/>
      <stop offset="100%" stop-color="#3d0206"/>
    </linearGradient>
    <!-- Luz ambiental superior -->
    <radialGradient id="haze" cx="0.5" cy="0" r="1">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#b3121f" stop-opacity="0"/>
    </radialGradient>
    <!-- Viñeta -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <!-- Brillo del símbolo -->
    <linearGradient id="psi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffd9dc"/>
      <stop offset="100%" stop-color="#ff9aa2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="118"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Base -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#haze)"/>

    <!-- Ondas de sonido al fondo -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M96 330 a160 160 0 0 1 320 0" stroke-opacity="0.07" stroke-width="10"/>
      <path d="M140 330 a116 116 0 0 1 232 0" stroke-opacity="0.10" stroke-width="10"/>
      <path d="M184 330 a72 72 0 0 1 144 0" stroke-opacity="0.13" stroke-width="10"/>
    </g>

    <!-- Brasas ascendentes -->
    <g fill="#ffb3b8" filter="url(#tinyGlow)">
      <circle cx="118" cy="392" r="4" opacity="0.55"/>
      <circle cx="398" cy="128" r="5" opacity="0.5"/>
      <circle cx="432" cy="366" r="3.5" opacity="0.4"/>
      <circle cx="86" cy="176" r="3" opacity="0.45"/>
      <circle cx="318" cy="84" r="3.5" opacity="0.35"/>
      <circle cx="452" cy="236" r="2.5" opacity="0.3"/>
      <circle cx="64" cy="286" r="2.5" opacity="0.3"/>
    </g>

    <!-- Símbolo Ψ -->
    <g filter="url(#softGlow)" stroke="url(#psi)" stroke-width="34" stroke-linecap="round" fill="none">
      <!-- asta central -->
      <path d="M256 148 V 380"/>
      <!-- brazo izquierdo -->
      <path d="M172 158 V 236 C 172 292 208 316 256 316"/>
      <!-- brazo derecho -->
      <path d="M340 158 V 236 C 340 292 304 316 256 316"/>
    </g>
    <!-- Culminación del asta -->
    <circle cx="256" cy="386" r="19" fill="url(#psi)" filter="url(#softGlow)"/>

    <!-- Viñeta y brillo superior -->
    <rect width="512" height="512" fill="url(#vignette)"/>
    <rect width="512" height="256" rx="118" fill="url(#gloss)"/>
  </g>

  <!-- Borde interior sutil -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
</svg>
